
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #101522, #252b4a);
      display: grid;
      place-items: center;
    }
    .app {
      width: 100%;
      max-width: 500px;
      padding: 24px;
      border: 1px solid #414a69;
      border-radius: 22px;
      background: #191f31;
      box-shadow: 0 15px 50px #0005;
    }
    h1 { margin-top: 0; }
    p { color: #bdc7e3; line-height: 1.5; }
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 1px solid #475273;
      border-radius: 12px;
      background: #101522;
      color: white;
      font-size: 16px;
      resize: vertical;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #a5b4fc;
      color: #17182c;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #status { margin-top: 18px; }
    #answer {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>✨ Gemini AI</h1>
    <p>Asisten AI pribadi kamu. Tanyakan apa saja!</p>

    <textarea id="message"
      maxlength="2000"
      placeholder="Tulis pertanyaan di sini..."></textarea>

    <button id="send">Kirim ke Gemini 🚀</button>
    <p id="status" role="status">Siap digunakan.</p>
    <div id="answer"></div>
  </main>

  <script>
    const message = document.getElementById("message");
    const button = document.getElementById("send");
    const status = document.getElementById("status");
    const answer = document.getElementById("answer");

    button.addEventListener("click", async () => {
      const question = message.value.trim();

      if (!question) {
        status.textContent = "Tulis pertanyaan dulu ya!";
        return;
      }

      button.disabled = true;
      status.textContent = "Gemini sedang berpikir...";
      answer.textContent = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: question })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Permintaan gagal.");
        }

        answer.textContent = data.reply;
        status.textContent = "Berhasil terhubung! ✅";
      } catch (error) {
        status.textContent = "Gagal: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
